<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>coomwall</title>
    <!-- Boot background, before theme.css loads, so the window never flashes
         white. Keep in sync with each theme's --bg-app in src/lib/theme.css. -->
    <style>
      html { margin: 0; color-scheme: dark; background: #111418; }
      html[data-theme="nord"] { background: #2e3440; }
      html[data-theme="gruvbox"] { background: #1d2021; }
      html[data-theme="catppuccin"] { background: #1e1e2e; }
      body { margin: 0; background: transparent; }
    </style>
    <script>
      try {
        var t = localStorage.getItem("coomwall-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
